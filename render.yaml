# Render Blueprint for ResolveAI Microservices
# Deploy both FastAPI AI service and Express API Gateway on Render

services:
  # FastAPI AI Service (Python)
  - type: web
    name: resolveai-ai-service
    env: python
    region: oregon
    plan: starter
    branch: main
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt && python build_index.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: VECTOR_STORE_PATH
        value: ./faiss_store
      - key: RETRIEVER_K
        value: 3
      - key: MINIMUM_POLICY_SIMILARITY
        value: 0.25
      - key: DEBUG_MODE
        value: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health
    autoDeploy: true

  # Express API Gateway (Node.js)
  - type: web
    name: resolveai-api-gateway
    env: node
    region: oregon
    plan: starter
    branch: main
    rootDir: web-api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: resolveai-ai-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 5000
    healthCheckPath: /health
    autoDeploy: true

# Database (use MongoDB Atlas - free tier)
# Visit https://cloud.mongodb.com/ to create a free cluster
# Add connection string to MONGODB_URI environment variable
