# Docker Compose for Local Development
# Run the entire stack with: docker-compose up

version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: resolveai-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: resolveai
    volumes:
      - mongodb_data:/data/db
    networks:
      - resolveai-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: resolveai-ai-service
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - VECTOR_STORE_PATH=./faiss_store
      - RETRIEVER_K=3
      - MINIMUM_POLICY_SIMILARITY=0.25
      - DEBUG_MODE=false
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./ai-service:/app
      - ai_faiss_data:/app/faiss_store
    networks:
      - resolveai-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Express API Gateway
  api-gateway:
    build:
      context: ./web-api
      dockerfile: Dockerfile
    container_name: resolveai-api-gateway
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/resolveai
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./web-api:/app
      - /app/node_modules
    networks:
      - resolveai-network
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend (optional - can run separately with npm run dev)
  # Uncomment if you want to run frontend in Docker
  # frontend:
  #   build:
  #     context: ./client
  #     dockerfile: Dockerfile
  #   container_name: resolveai-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - VITE_API_URL=http://localhost:5000
  #   volumes:
  #     - ./client:/app
  #     - /app/node_modules
  #   networks:
  #     - resolveai-network
  #   depends_on:
  #     - api-gateway

networks:
  resolveai-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  ai_faiss_data:
    driver: local
